<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Vibrant Accent Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(6px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(10px) translateX(-5px); }
    }
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.18); opacity: 0.45; }
    }
    @keyframes codeFlow {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes dashCycle {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    .orb-glow {
      transform-origin: center;
      animation: pulseOrb 6s ease-in-out infinite;
    }
    .floating-pill-1 {
      animation: floatPill1 5s ease-in-out infinite;
    }
    .floating-pill-2 {
      animation: floatPill2 6s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 200, 400;
      animation: codeFlow 10s linear infinite;
    }
    .tech-border {
      stroke-dasharray: 6, 6;
      animation: dashCycle 3s linear infinite;
    }
    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
    .pill-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 600;
      font-size: 13px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="18" fill="url(#bgGrad)"/>
  <rect width="1198" height="358" x="1" y="1" rx="17" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="orb-glow">
    <circle cx="200" cy="90" r="140" fill="#38bdf8" filter="url(#glow)" opacity="0.18"/>
    <circle cx="1020" cy="260" r="160" fill="#c084fc" filter="url(#glow)" opacity="0.16"/>
    <circle cx="600" cy="310" r="100" fill="#f472b6" filter="url(#glow)" opacity="0.12"/>
  </g>

  <!-- Background Grid Pattern -->
  <g stroke="#334155" stroke-opacity="0.18" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Animated Data / Code Flow Line (Behind Foreground Text) -->
  <path class="flow-line" d="M -50,300 C 300,340 400,20 700,40 C 950,55 1050,320 1250,280" fill="none" stroke="url(#neonGrad)" stroke-width="2.5" opacity="0.55"/>

  <!-- Left Dynamic Tech Feature Card (Subtle Background Context) -->
  <g class="floating-pill-1" transform="translate(60, 48)">
    <rect width="180" height="42" rx="21" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="22" cy="21" r="5" fill="#38bdf8" filter="url(#subtleGlow)"/>
    <text x="36" y="26" fill="#7dd3fc" class="pill-text">AI CODING AGENTS</text>
  </g>

  <g class="floating-pill-2" transform="translate(940, 52)">
    <rect width="195" height="42" rx="21" fill="url(#pillGrad2)" stroke="#c084fc" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="22" cy="21" r="5" fill="#c084fc" filter="url(#subtleGlow)"/>
    <text x="36" y="26" fill="#e9d5ff" class="pill-text">AUTONOMOUS IDEs</text>
  </g>

  <g class="floating-pill-2" transform="translate(80, 275)">
    <rect width="190" height="42" rx="21" fill="url(#pillGrad3)" stroke="#34d399" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="22" cy="21" r="5" fill="#34d399" filter="url(#subtleGlow)"/>
    <text x="36" y="26" fill="#a7f3d0" class="pill-text">100% OPEN SOURCE</text>
  </g>

  <g class="floating-pill-1" transform="translate(930, 270)">
    <rect width="200" height="42" rx="21" fill="url(#pillGrad1)" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="22" cy="21" r="5" fill="#818cf8" filter="url(#subtleGlow)"/>
    <text x="36" y="26" fill="#c7d2fe" class="pill-text">ENTERPRISE SAAS</text>
  </g>

  <!-- Main Center Foreground Container: Always Stays Crisp and Readable Above Animation -->
  <g id="foreground-content">
    <!-- Category Badge -->
    <g transform="translate(470, 75)">
      <rect width="260" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1"/>
      <circle cx="18" cy="17" r="4.5" fill="#38bdf8" />
      <text x="32" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" letter-spacing="1.2">CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="170" text-anchor="middle" class="main-title" font-size="48" fill="url(#neonGrad)" filter="url(#subtleGlow)">
      Awesome AI Coding Tools
    </text>

    <!-- High-Contrast Subtitle (Sharp & Legible) -->
    <text x="600" y="215" text-anchor="middle" class="sub-title" font-size="19" fill="#f8fafc">
      Top AI-Native IDEs, Autonomous Coding Agents, Autocomplete &amp; Open-Source LLMs
    </text>

    <!-- Micro Metadata Tags -->
    <text x="600" y="248" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="14" fill="#94a3b8">
      Cursor • GitHub Copilot • Claude Code • Ollama • Windsurf • Aider • Cline • OpenHands
    </text>
  </g>
</svg>
